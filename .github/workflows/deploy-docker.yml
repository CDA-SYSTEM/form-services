name: Deploy NestJS Docker

on:
  push:
    branches: [ "develop", "feature/config-deploy" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  packages: write
  contents: read

jobs:
  deploy-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set repository name to lowercase
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            # Iniciar sesión en GHCR desde el servidor
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Descargar la última imagen
            docker pull ghcr.io/${{ env.REPO_LC }}:latest

            # Detener y eliminar contenedor existente
            docker stop form-service || true
            docker rm form-service || true

            # Iniciar nuevo contenedor
            docker run -d \
              --name form-service \
              -p ${{ secrets.PORT }}:${{ secrets.PORT }} \
              -e PORT="${{ secrets.PORT }}" \
              -e MONGO_URI="${{ secrets.MONGO_URI }}" \
              -e MONGO_URI_PROD="${{ secrets.MONGO_URI_PROD }}" \
              -e API_KEY="${{ secrets.API_KEY }}" \
              -e NODE_ENV="${{ secrets.NODE_ENV }}" \
              -e RABBITMQ_URI="${{ secrets.RABBITMQ_URI }}" \
              -e RABBITMQ_QUEUE_USER="${{ secrets.RABBITMQ_QUEUE_USER }}" \
              -e RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD }}" \
              -e RABBITMQ_HOST="${{ secrets.RABBITMQ_HOST }}" \
              -e RABBITMQ_PORT="${{ secrets.RABBITMQ_PORT }}" \
              -e RABBITMQ_CLIENT_QUEUE="${{ secrets.RABBITMQ_CLIENT_QUEUE }}" \
              -e RABBITMQ_VEHICLE_QUEUE="${{ secrets.RABBITMQ_VEHICLE_QUEUE }}" \
              -e RABBITMQ_RPC_TIMEOUT_MS="${{ secrets.RABBITMQ_RPC_TIMEOUT_MS }}" \
              --restart unless-stopped \
              ghcr.io/${{ env.REPO_LC }}:latest

            # Limpiar imágenes antiguas
            docker image prune -f
